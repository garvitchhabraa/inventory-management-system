<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Flow | Create Account</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="background">
    <div class="grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>
</div>

<main class="login-page">

    <section class="brand-section">
        <div class="brand-logo">
            <div class="logo-icon">S</div>
            <div>
                <h1>Stock Flow</h1>
                <span>Smart Inventory Management</span>
            </div>
        </div>

        <div class="brand-content">
            <p class="small-title">CREATE YOUR ACCOUNT</p>
            <h2>Join <span>Stock Flow</span></h2>
            <p class="description">
                Create a new account to start managing your inventory, products and business operations efficiently.
            </p>
        </div>
    </section>

    <section class="login-section">
        <div class="login-card">

            <div class="login-header">
                <h2>Create Account</h2>
                <p>Register a new Stock Flow account.</p>
            </div>

            <form id="registerForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>

                <p id="registerError" class="login-error"></p>

                <button type="submit" class="login-btn">
                    Create Account <span>→</span>
                </button>
            </form>

            <div class="register-link">
                Already have an account?
                <a href="login.html">Sign In</a>
            </div>

        </div>
    </section>

</main>

<script src="js/register.js"></script>
</body>
</html>
